name: Bug report
description: Report a reproducible problem without including real private data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thank you. Use fictional examples only—never paste real credentials or personal information."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected and observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal steps using fictional data.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
